name: Build Vampirism Witch JAR
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build mod
        run: gradle clean build --stacktrace
      - name: Verify compiled mod
        run: |
          jar tf build/libs/vampirismwitch-0.5.0.jar | grep 'WitchCauldronBlock.class'
          jar tf build/libs/vampirismwitch-0.5.0.jar | grep 'WitchMobPeace.class'
          jar tf build/libs/vampirismwitch-0.5.0.jar | grep 'WitchSkills.class'
      - name: Verify skill texture and advancement
        run: |
          jar tf build/libs/vampirismwitch-0.5.0.jar | grep 'assets/vampirismwitch/textures/skills/cauldron_mastery.png'
          jar tf build/libs/vampirismwitch-0.5.0.jar | grep 'data/vampirismwitch/advancement/root.json'
      - name: Check advancement and model assets
        run: |
          jar tf build/libs/vampirismwitch-0.5.0.jar | grep 'data/vampirismwitch/advancement/root.json'
          jar tf build/libs/vampirismwitch-0.5.0.jar | grep 'assets/vampirismwitch/textures/skills/cauldron_mastery.png'
          jar tf build/libs/vampirismwitch-0.5.0.jar | grep 'assets/vampirismwitch/models/block/witch_cauldron_base.json'
      - name: Verify Witch advancement assets
        run: |
          jar tf build/libs/vampirismwitch-0.5.0.jar | grep 'data/vampirismwitch/advancement/become_witch.json'
      - name: Verify new Witch skill and point provider
        run: |
          jar tf build/libs/vampirismwitch-0.5.0.jar | grep 'WitchSkillPoints.class'
          jar tf build/libs/vampirismwitch-0.5.0.jar | grep 'data/vampirismwitch/factionapi/skill_segment/witch/potion_resistance.json'
      - name: Upload test JAR
        uses: actions/upload-artifact@v4
        with:
          name: Vampirism-Witch-0.5.0
          path: build/libs/vampirismwitch-0.5.0.jar
          if-no-files-found: error
