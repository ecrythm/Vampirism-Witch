name: Build Vampirism Witch JAR
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build mod
        run: gradle clean build --stacktrace
      - name: Verify compiled mod
        run: |
          jar tf build/libs/vampirismwitch-0.4.0.jar | grep 'WitchCauldronBlock.class'
          jar tf build/libs/vampirismwitch-0.4.0.jar | grep 'WitchMobPeace.class'
          jar tf build/libs/vampirismwitch-0.4.0.jar | grep 'WitchSkills.class'
      - name: Upload test JAR
        uses: actions/upload-artifact@v4
        with:
          name: Vampirism-Witch-0.4.0
          path: build/libs/vampirismwitch-0.4.0.jar
          if-no-files-found: error
